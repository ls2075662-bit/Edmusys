<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdMusys - Sistema de Gestão</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=buABIT9u3tmN&format=png&color=000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/homepage.css">
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="staff">
        <img src="https://img.icons8.com/?size=100&id=buABIT9u3tmN&format=png&color=000000" alt="EdMusys Logo" class="login-icon">
      </div>
      <h1>EdMusys</h1>
      <p>Sistema de Gestão</p>
    </div>
    <form class="login-form" id="loginForm">
      <div class="login-error" id="loginError">Selecione seu nome antes de entrar.</div>
      <div>
        <span class="field-group-lbl">Entrar como</span>
        <div class="pill-select" id="roleGroup">
          <button type="button" class="pill-opt" id="btn-administrador">Administrador</button>
          <button type="button" class="pill-opt on" data-role="professor">Professor</button>
          <button type="button" class="pill-opt" data-role="aluno">Aluno</button>
        </div>
      </div>
      <div class="ifield" id="userLoginFields">
        <label for="userLogin">Nome, CPF ou E-mail</label>
        <div class="icontainer">
          <input type="text" id="userLogin" placeholder="Digite seu nome, CPF ou e-mail">
        </div>
        <label for="userPassword">Senha</label>
        <div class="icontainer">
          <input
            type="password"
            id="userPassword"
            placeholder="Digite sua senha"
          >
        </div>
      </div>
      <div class="ifield" id="adminLoginFields" style="display: none;">
        <label for="adminUser">Nome, CPF ou E-mail</label>
        <div class="icontainer">
            <input type="text" id="adminUser" placeholder="Digite seu nome, CPF ou e-mail">
        </div>
        <label for="adminPass">Senha</label>
        <div class="icontainer">
            <input type="password" id="adminPass" placeholder="Digite sua senha">
        </div>
    </div>
      <button type="submit" class="login-submit" id="enterBtn">Entrar no sistema</button>
      <button type="button" class="novo-usuario" id="novoAdmin" style="display: none;" onclick="window.location.href='cadastro.html'">
      Cadastrar novo administrador
      </button>
    </form>
    <p class="login-hint">Dados salvos localmente no navegador</p>
  </div>
</div>
<script src="js/homepage.js"></script>
</body>
</html>
