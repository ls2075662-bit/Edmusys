<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdMusys — Portal do Aluno</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#121110; --black-soft:#1C1B18; --black-elev:#242220;
  --white:#FFFFFF; --cream:#FBF9F4; --cream-dim:#F1EDE3;
  --gold:#F0B90B; --gold-deep:#C99400; --gold-pale:#FCE9A8;
  --line:#33312B; --line-light:#E4DFD1;
  --muted:#8A8579; --muted-dark:#B9B4A6;
  --danger:#E5484D; --success:#3FB25E;
  --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --shadow-card:0 1px 2px rgba(18,17,16,.06),0 8px 24px -12px rgba(18,17,16,.18);
  --shadow-pop:0 20px 60px -20px rgba(18,17,16,.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--cream);color:var(--black);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--gold-pale);color:var(--black);}
.hidden{display:none!important;}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--black);color:var(--cream);
  display:flex;flex-direction:column;padding:22px 16px;
  position:sticky;top:0;height:100vh;
}
.brand-btn{
  display:flex;align-items:center;gap:10px;background:none;border:none;
  color:var(--gold);padding:6px 4px 22px;text-align:left;width:100%;
}
.brand-btn .mark{
  width:34px;height:34px;background:var(--gold);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-btn .mark svg{width:19px;height:19px;color:var(--black);}
.brand-btn .name{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--white);letter-spacing:-.01em;}
.nav-group{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.nav-btn{
  display:flex;align-items:center;gap:11px;background:none;border:none;
  color:var(--muted-dark);padding:11px 12px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;text-align:left;
  transition:background .15s ease,color .15s ease;
}
.nav-btn svg{width:17px;height:17px;flex-shrink:0;}
.nav-btn:hover{background:var(--black-elev);color:var(--white);}
.nav-btn.active{background:var(--gold);color:var(--black);}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);}
.logout-btn{
  display:flex;align-items:center;gap:10px;background:none;border:none;
  color:var(--muted-dark);padding:10px 12px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;width:100%;
  transition:background .15s,color .15s;
}
.logout-btn:hover{background:var(--black-elev);color:var(--white);}
.logout-btn svg{width:16px;height:16px;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 32px;border-bottom:1px solid var(--line-light);
  background:var(--cream);position:sticky;top:0;z-index:20;
}
.topbar h2{font-family:var(--font-display);font-size:22px;font-weight:700;}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px;}
.menu-toggle{
  display:none;background:var(--black);color:var(--gold);border:none;
  width:38px;height:38px;border-radius:var(--radius-sm);
  align-items:center;justify-content:center;
}
.menu-toggle svg{width:18px;height:18px;}
.view{padding:28px 32px 60px;flex:1;}

/* ── BTN ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:none;
  border-radius:var(--radius-md);padding:10px 18px;font-size:13px;
  font-weight:700;cursor:pointer;transition:transform .15s,background .15s;
}
.btn:hover{transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:var(--black);}
.btn-gold:hover{background:var(--gold-deep);}
.btn-dark{background:var(--black);color:var(--gold);}
.btn-dark:hover{background:#000;}
.btn svg{width:16px;height:16px;}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:var(--radius-sm);font-weight:700;border:none;}
.btn-sm.save{background:var(--gold);color:var(--black);}
.btn-sm.cancel{background:var(--black-elev);color:var(--cream);}

/* ── ICON-BTN ── */
.icon-btn{
  background:none;border:1.5px solid var(--line-light);color:var(--muted);
  width:34px;height:34px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;
}
.icon-btn:hover{background:var(--cream-dim);color:var(--black);border-color:var(--line);}
.icon-btn svg{width:15px;height:15px;}

/* ── BADGE ── */
.badge{
  display:inline-flex;align-items:center;
  background:var(--gold-pale);color:var(--gold-deep);
  border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:700;
  letter-spacing:.03em;
}
.badge.pago{background:#D7F2E2;color:#2A7A43;}
.badge.pendente{background:#FFE8E8;color:#C53030;}

/* ── AVATAR ── */
.avatar{
  width:44px;height:44px;border-radius:50%;background:var(--black);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;flex-shrink:0;letter-spacing:-.02em;
}
.avatar.lg{width:72px;height:72px;font-size:26px;}

/* ── PROFILE HEADER ── */
.profile-hero{
  background:var(--black);padding:32px 32px 56px;
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  margin:-28px -32px 0;
}
.profile-hero .back-btn{
  background:var(--black-elev);border:none;color:var(--cream);
  width:36px;height:36px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;
}
.profile-hero .back-btn svg{width:17px;height:17px;}
.profile-hero-id{display:flex;align-items:center;gap:16px;}
.profile-hero-id h2{font-family:var(--font-display);color:var(--white);font-size:24px;}
.profile-hero-id .badge{margin-top:6px;}
.profile-hero-info{
  display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;
}
.profile-hero-info .info-chip{
  display:flex;align-items:center;gap:6px;
  color:var(--muted-dark);font-size:12.5px;font-weight:500;
}
.profile-hero-info .info-chip svg{width:14px;height:14px;color:var(--gold);}

/* ── CONTENT CARD ── */
.content-card{
  background:var(--white);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);overflow:hidden;margin-top:28px;
}
.content-card-head{
  padding:18px 22px;border-bottom:1px solid var(--line-light);
  display:flex;align-items:center;gap:10px;
}
.content-card-head h3{font-family:var(--font-display);font-size:16px;}
.content-card-head svg{width:17px;height:17px;color:var(--gold-deep);}
.content-card-body{padding:20px 22px;}

/* ── WEEKLY CALENDAR ── */
.week-nav{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;
}
.day-pill{
  display:flex;align-items:center;gap:7px;
  border:1.5px solid var(--line-light);border-radius:99px;
  padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted-dark);
  background:none;cursor:pointer;transition:all .15s;
}
.day-pill .cnt{
  background:var(--cream-dim);color:var(--muted);
  font-family:var(--font-mono);font-size:11px;font-weight:700;
  min-width:18px;height:18px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
}
.day-pill.active{background:var(--black);border-color:var(--black);color:var(--gold);}
.day-pill.active .cnt{background:var(--gold);color:var(--black);}
.schedule-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}

/* ── TICKET CARD ── */
.ticket-card{
  background:var(--white);border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow-card);position:relative;
}
.ticket-band{
  background:linear-gradient(120deg,var(--gold-deep),var(--gold) 65%);
  padding:14px 18px;display:flex;align-items:baseline;justify-content:space-between;
}
.ticket-band .day{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--black);}
.ticket-band .time{font-family:var(--font-mono);font-weight:700;font-size:22px;color:var(--black);letter-spacing:-.02em;}
.ticket-perf{
  height:14px;position:relative;background:var(--white);
  background-image:radial-gradient(circle 6px at 0 0,transparent 6px,var(--white) 6.5px),
    radial-gradient(circle 6px at 100% 0,transparent 6px,var(--white) 6.5px);
}
.ticket-perf::before{
  content:"";position:absolute;top:0;left:14px;right:14px;
  height:0;border-top:2px dashed var(--line-light);
}
.ticket-body{padding:16px 18px 18px;}
.ticket-instrument{
  font-size:16px;font-weight:700;color:var(--black);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.ticket-instrument svg{width:17px;height:17px;color:var(--gold-deep);}
.ticket-people{display:flex;align-items:stretch;}
.ticket-people .side{flex:1;min-width:0;}
.ticket-people .side .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px;}
.ticket-people .side .val{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ticket-divider{width:1px;background:var(--line-light);margin:2px 16px;}

/* ── STUDENTS TABLE ── */
.students-table{width:100%;border-collapse:collapse;}
.students-table th{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:10px 12px;text-align:left;
  border-bottom:1.5px solid var(--line-light);
}
.students-table td{
  padding:13px 12px;border-bottom:1px solid var(--line-light);
  font-size:13.5px;vertical-align:middle;
}
.students-table tr:last-child td{border-bottom:none;}
.students-table tr:hover td{background:var(--cream-dim);}
.student-row-name{display:flex;align-items:center;gap:10px;}
.student-row-name .av{
  width:34px;height:34px;border-radius:50%;background:var(--black);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;
}

/* ── INFO GRID ── */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.info-item .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;}
.info-item .val{font-size:14px;font-weight:600;color:var(--black);}

/* ── PLAN CHIP ── */
.plan-chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--gold-pale);border-radius:99px;padding:6px 14px;
  font-size:12px;font-weight:700;color:var(--gold-deep);
}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 0;color:var(--muted);}
.empty svg{width:32px;height:32px;opacity:.35;margin:0 auto 10px;display:block;}

/* ── LOGIN SCREEN ── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 15% -10%,rgba(240,185,11,.10),transparent 60%),
    linear-gradient(180deg,var(--black) 0%,var(--black-soft) 100%);
  padding:24px;
}
.login-card{
  width:100%;max-width:420px;background:var(--cream);
  border-radius:var(--radius-lg);padding:44px 36px 36px;
  box-shadow:var(--shadow-pop);position:relative;overflow:hidden;
}
.login-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold) 50%,var(--gold-deep));
}
.login-brand{text-align:center;margin-bottom:28px;}
.login-brand img{height:90px;width:auto;display:block;margin:0 auto 10px;}
.login-brand p{color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase;}
.ifield{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.ifield label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-left:2px;}
.ifield .icontainer{
  display:flex;align-items:center;gap:8px;
  border:1.5px solid var(--line-light);border-radius:var(--radius-sm);
  background:var(--white);padding:0 12px;
  transition:border-color .15s,box-shadow .15s;
}
.ifield .icontainer:focus-within{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(240,185,11,.22);}
.ifield .icontainer input,.ifield .icontainer select{flex:1;border:none;outline:none;background:transparent;padding:11px 0;font-size:14.5px;color:var(--black);min-width:0;}
.ifield .icontainer svg{width:17px;height:17px;color:var(--muted);flex-shrink:0;}
.ifield .icontainer select option{background:var(--cream);}
.login-error{display:none;background:#FBEAEA;color:var(--danger);font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);font-weight:600;margin-bottom:8px;}
.login-error.show{display:block;}
.login-submit{
  width:100%;background:var(--black);color:var(--gold);
  border:none;border-radius:var(--radius-md);padding:14px;
  font-weight:700;font-size:15px;letter-spacing:.02em;
  transition:transform .15s,background .15s;margin-top:6px;
}
.login-submit:hover{background:#000;transform:translateY(-1px);}
.login-hint{text-align:center;margin-top:14px;font-size:12px;color:var(--muted);}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  .sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-pop);}
  .sidebar.open{transform:translateX(0);}
  .topbar{padding:18px;}
  .view{padding:20px 18px 60px;}
  .menu-toggle{display:flex!important;}
  .profile-hero{margin:-20px -18px 0;border-radius:0;}
  .info-grid{grid-template-columns:1fr;}
}
@media(max-width:520px){
  .schedule-grid{grid-template-columns:1fr;}
  .week-nav{gap:6px;}
}
</style>

</head>
<body>

<!-- LOGIN -->
<div id="login-screen">

      <p>Portal do Aluno</p>

        <select id="sel-aluno"><option value="">Selecione seu nome...</option></select>

</div>

<div id="app" class="hidden">
  <div id="shell"></div>
</div>

<script>

const ICON = {

  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',

  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
};

const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const PLANOS = {1:{label:'1x / semana',valor:60},2:{label:'2x / semana',valor:120},3:{label:'3x / semana',valor:180}};

const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const maskPhone = v => {
  let d=v.replace(/\D/g,'').slice(0,11);
  if(d.length>10) return d.replace(/(\d{2})(\d{5})(\d{0,4})/,(_,a,b,c)=>c?`(${a}) ${b}-${c}`:`(${a}) ${b}`);
  if(d.length>6)  return d.replace(/(\d{2})(\d{4})(\d{0,4})/,(_,a,b,c)=>c?`(${a}) ${b}-${c}`:`(${a}) ${b}`);
  if(d.length>2)  return d.replace(/(\d{2})(\d*)/,(_,a,b)=>b?`(${a}) ${b}`:`(${a}`);
  return d.length?`(${d}`:'';
};

// ── DATA (mirrors script.js seed) ─────────────────────────────
let alunos = [

  {id:'a2',nome:'Bento Alves',instrumento:'Piano',dias:['Terça','Quinta','Sábado'],horarios:['09:00','09:00','10:00'],telefone:'84998765432',email:'bento.alves@email.com',nascimento:'2014-07-02',plano:3,pago:false},
  {id:'a3',nome:'Yasmin Rocha',instrumento:'Bateria',dias:['Sexta'],horarios:['17:00'],telefone:'84987654321',email:'',nascimento:'2009-11-21',plano:1,pago:true},
  {id:'a4',nome:'Davi Nunes',instrumento:'Canto',dias:['Segunda','Sexta'],horarios:['18:00','18:00'],telefone:'84996655443',email:'davi.nunes@email.com',nascimento:'2013-01-09',plano:2,pago:true},

function sidebar(activeTab) {
  return `<aside class="sidebar" id="sidebar">
    <button class="brand-btn" onclick="goHome()">
      <span class="mark">${ICON.music}</span>
      <span class="name">EdMusys</span>
    </button>
    <nav class="nav-group">
      <button class="nav-btn ${activeTab==='horarios'?'active':''}" onclick="showTab('horarios')">${ICON.calendar} Minha Agenda</button>
      <button class="nav-btn ${activeTab==='alunos_prof'?'active':''}" onclick="showTab('alunos_prof')">${ICON.students} Meus Alunos</button>
      <button class="nav-btn ${activeTab==='perfil'?'active':''}" onclick="showTab('perfil')">${ICON.user} Meu Perfil</button>
    </nav>
    <div class="sidebar-foot">
      <button class="logout-btn" onclick="doLogout()">${ICON.logout} Sair</button>
    </div>
  </aside>`;
}

function sidebarAluno(activeTab) {
  return `<aside class="sidebar" id="sidebar">
    <button class="brand-btn" onclick="goHome()">
      <span class="mark">${ICON.music}</span>
      <span class="name">EdMusys</span>
    </button>
    <nav class="nav-group">
      <button class="nav-btn ${activeTab==='agenda'?'active':''}" onclick="showTab('agenda')">${ICON.calendar} Minha Agenda</button>
      <button class="nav-btn ${activeTab==='professor'?'active':''}" onclick="showTab('professor')">${ICON.user} Meu Professor</button>
      <button class="nav-btn ${activeTab==='pagamento'?'active':''}" onclick="showTab('pagamento')">${ICON.cash} Pagamento</button>
      <button class="nav-btn ${activeTab==='perfil'?'active':''}" onclick="showTab('perfil')">${ICON.tag} Meu Perfil</button>
    </nav>
    <div class="sidebar-foot">
      <button class="logout-btn" onclick="doLogout()">${ICON.logout} Sair</button>
    </div>
  </aside>`;
}

function goHome(){ window.location.href='index.html'; }
function doLogout(){ window.location.href='index.html'; }
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}


const sel = document.getElementById('sel-aluno');
alunos.forEach(a => {
  const o = document.createElement('option');
  o.value = a.id; o.textContent = a.nome;
  sel.appendChild(o);
});

let currentAlunoId = null;
let currentTab = 'agenda';
let selectedDay = 'Segunda';

function doLogin() {
  const v = sel.value;
  if (!v) { document.getElementById('login-err').classList.add('show'); return; }
  currentAlunoId = v;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render();
}

function showTab(t) { currentTab = t; render(); }

function render() {
  const aluno = alunos.find(a => a.id === currentAlunoId);
  if (!aluno) return;
  const myHorarios = horarios.filter(h => h.alunoId === aluno.id);
  const myProfIds = [...new Set(myHorarios.map(h => h.professorId))];
  const myProfs = myProfIds.map(id => professores.find(p => p.id === id)).filter(Boolean);

  let viewHTML = '';
  let title = '', sub = '';
  if (currentTab === 'agenda') { viewHTML = renderAgenda(aluno, myHorarios, myProfs); title='Minha Agenda'; sub='Seus dias e horários de aula'; }
  else if (currentTab === 'professor') { viewHTML = renderProfessor(aluno, myHorarios, myProfs); title='Meu Professor'; sub='Informações do seu professor'; }
  else if (currentTab === 'pagamento') { viewHTML = renderPagamento(aluno); title='Pagamento'; sub='Status da sua mensalidade'; }
  else { viewHTML = renderPerfil(aluno, myHorarios, myProfs); title='Meu Perfil'; sub='Seus dados cadastrais'; }

  document.getElementById('shell').innerHTML = `
    <div class="app">
      ${sidebarAluno(currentTab)}
      <div class="main">
        <div class="topbar">
          <div style="display:flex;align-items:center;gap:12px;">
            <button class="menu-toggle" onclick="toggleSidebar()">${ICON.menu}</button>
            <div>
              <h2>${title}</h2>
              <div class="sub">${sub}</div>
            </div>
          </div>
          ${currentTab==='pagamento'?`<span class="badge ${aluno.pago?'pago':'pendente'}">${aluno.pago?'✓ PAGO':'⚠ PENDENTE'}</span>`:''}
        </div>
        <div class="view">${viewHTML}</div>
      </div>
    </div>`;
}

// ── AGENDA ─────────────────────────────────────────────
function renderAgenda(aluno, myHorarios, myProfs) {
  const diasAtivos = [...new Set(myHorarios.map(h => h.dia))];
  if (!diasAtivos.includes(selectedDay)) selectedDay = diasAtivos[0] || 'Segunda';

  const dayHorarios = myHorarios.filter(h => h.dia === selectedDay)
    .sort((a,b) => a.hora.localeCompare(b.hora));

  const pills = DIAS.map(d => {
    const cnt = myHorarios.filter(h => h.dia === d).length;
    if (cnt === 0) return '';
    const act = d === selectedDay;
    return `<button class="day-pill ${act?'active':''}" onclick="selDay('${d}')">
      ${d} <span class="cnt">${cnt}</span>
    </button>`;
  }).join('');

  const cards = dayHorarios.length === 0
    ? `<div class="empty">${ICON.calendar}<p>Nenhuma aula neste dia.</p></div>`
    : `<div class="schedule-grid">
      ${dayHorarios.map(h => {
        const pr = professores.find(p => p.id === h.professorId);
        return `<div class="ticket-card">
          <div class="ticket-band">
            <span class="day">${esc(h.dia)}</span>
            <span class="time">${esc(h.hora)}</span>
          </div>
          <div class="ticket-perf"></div>
          <div class="ticket-body">
            <div class="ticket-instrument">${ICON.music} ${esc(h.instrumento)}</div>
            <div class="ticket-people">
              <div class="side">
                <div class="lbl">Professor</div>
                <div class="val">${esc(pr ? pr.nome : '—')}</div>
              </div>
            </div>
            ${pr ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line-light);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);">
              ${ICON.phone} ${maskPhone(pr.telefone)}
            </div>` : ''}
          </div>
        </div>`;
      }).join('')}
      </div>`;

  return `<div class="content-card" style="margin-top:0;">
    <div class="content-card-head">${ICON.calendar} <h3>Calendário semanal</h3></div>
    <div class="content-card-body">
      <div class="week-nav">${pills}</div>
      ${cards}
    </div>
  </div>

  <!-- RESUMO SEMANAL -->
  <div class="content-card">
    <div class="content-card-head">${ICON.clock} <h3>Resumo semanal</h3></div>
    <div class="content-card-body">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
        ${DIAS.map(d => {
          const dh = myHorarios.filter(h => h.dia === d);
          if (!dh.length) return '';
          return `<div style="background:var(--cream-dim);border-radius:var(--radius-md);overflow:hidden;">
            <div style="background:var(--black);color:var(--gold);padding:9px 14px;font-family:var(--font-display);font-weight:700;font-size:14px;">
              ${d}
            </div>
            <div style="padding:10px 12px;display:flex;flex-direction:column;gap:7px;">
              ${dh.map(h => {
                const pr = professores.find(p => p.id === h.professorId);
                return `<div style="font-size:12.5px;">
                  <span style="font-family:var(--font-mono);font-weight:700;color:var(--gold-deep);">${h.hora}</span>
                  <span style="font-weight:600;margin-left:6px;">${esc(h.instrumento)}</span>
                  <div style="font-size:11.5px;color:var(--muted);margin-top:1px;">Prof. ${esc(pr?pr.nome:'—')}</div>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function selDay(d) { selectedDay = d; render(); }

// ── MEU PROFESSOR ──────────────────────────────────────
function renderProfessor(aluno, myHorarios, myProfs) {
  if (!myProfs.length) return `<div class="empty">${ICON.user}<p>Nenhum professor vinculado.</p></div>`;

  return myProfs.map(prof => {
    const aulas = myHorarios.filter(h => h.professorId === prof.id);
    return `
    <div class="content-card" style="margin-top:0;margin-bottom:20px;">
      <div style="background:var(--black);padding:24px 22px;display:flex;align-items:center;gap:14px;">
        <div class="avatar lg">${ini(prof.nome)}</div>
        <div>
          <div style="font-family:var(--font-display);color:var(--white);font-size:20px;font-weight:700;">${esc(prof.nome)}</div>
          <span class="badge">${esc(prof.instrumento)}</span>
        </div>
      </div>
      <div class="content-card-body">
        <div class="info-grid" style="margin-bottom:20px;">
          <div class="info-item"><div class="lbl">Especialidade</div><div class="val">${esc(prof.instrumento)}</div></div>
          <div class="info-item"><div class="lbl">Telefone</div><div class="val">${maskPhone(prof.telefone)}</div></div>
          <div class="info-item"><div class="lbl">E-mail</div><div class="val">${esc(prof.email||'—')}</div></div>
        </div>
        <div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Suas aulas com este professor</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${aulas.map(h => `<div style="background:var(--gold-pale);border-radius:var(--radius-md);padding:10px 16px;">
            <div style="font-family:var(--font-mono);font-weight:700;color:var(--gold-deep);font-size:16px;">${h.hora}</div>
            <div style="font-size:12px;font-weight:600;color:var(--black);margin-top:2px;">${h.dia} · ${esc(h.instrumento)}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── PAGAMENTO ──────────────────────────────────────────
function renderPagamento(aluno) {
  const plano = PLANOS[aluno.plano];
  const statusColor = aluno.pago ? 'var(--success)' : 'var(--danger)';
  const statusBg = aluno.pago ? '#D7F2E2' : '#FFE8E8';
  const statusLabel = aluno.pago ? 'Mensalidade paga' : 'Pagamento pendente';

  return `
    <div class="content-card" style="margin-top:0;">
      <div class="content-card-head">${ICON.cash} <h3>Status da mensalidade</h3></div>
      <div class="content-card-body">
        <!-- STATUS BANNER -->
        <div style="background:${statusBg};border-radius:var(--radius-md);padding:18px 20px;display:flex;align-items:center;gap:14px;margin-bottom:20px;">
          <div style="width:42px;height:42px;border-radius:50%;background:${statusColor};display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-size:20px;">
            ${aluno.pago ? ICON.check : '!'}
          </div>
          <div>
            <div style="font-size:16px;font-weight:700;color:${statusColor};">${statusLabel}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:2px;">${aluno.pago?'Obrigado! Seu pagamento foi confirmado.':'Entre em contato com a escola para regularizar.'}</div>
          </div>
        </div>

        <!-- PLANO DETAILS -->
        <div class="info-grid">
          <div class="info-item">
            <div class="lbl">Plano atual</div>
            <div class="val"><span class="plan-chip">${esc(plano?plano.label:'—')}</span></div>
          </div>
          <div class="info-item">
            <div class="lbl">Valor mensal</div>
            <div style="font-size:28px;font-weight:800;font-family:var(--font-display);color:var(--black);">R$ ${plano?plano.valor:'—'}</div>
          </div>
          <div class="info-item">
            <div class="lbl">Instrumento</div>
            <div class="val">${esc(aluno.instrumento)}</div>
          </div>
          <div class="info-item">
            <div class="lbl">Aulas por semana</div>
            <div class="val">${aluno.plano}x / semana</div>
          </div>
        </div>

        <!-- WHAT'S INCLUDED -->
        <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line-light);">
          <div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;">O que está incluso</div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${[
              `${aluno.plano}x aula(s) de ${aluno.instrumento} por semana`,
              'Material de apoio incluso',
              'Reagendamento com 24h de antecedência',
            ].map(item => `<div style="display:flex;align-items:center;gap:10px;font-size:13.5px;">
              <div style="width:22px;height:22px;border-radius:50%;background:var(--gold-pale);display:flex;align-items:center;justify-content:center;color:var(--gold-deep);flex-shrink:0;">${ICON.check}</div>
              ${item}
            </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
}

      </div>
    </div>

    <div class="content-card">
      <div class="content-card-head">${ICON.tag} <h3>Plano & Aulas</h3></div>

              <div style="font-family:var(--font-mono);font-weight:700;color:var(--gold-deep);">${h.dia} ${h.hora}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${esc(h.instrumento)} · Prof. ${esc(pr?pr.nome:'—')}</div>
            </div>`;
          }).join('')}

      </div>
    </div>`;
}
