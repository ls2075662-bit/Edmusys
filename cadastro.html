<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdMusys — Novo Usuário</title>
  <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

  <main class="cadastro-card"> <!-- caixa de cadastro usuario-->

    <header class="cadastro-header">
      <div class="logo"></div>

      <h1>EdMusys</h1>
      <p>CADASTRAR ADMINISTRADOR</p>
    </header>

    <form id="formCadastro">

      <div class="form-group">
        <label for="nome">CPF</label>   <!--campo de cpf-->

        <div class="input-wrapper">
          <span class="input-icon">♙</span>
          <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="Informe seu CPF"
            inputmode="numeric"
            maxlength="14"
            autocomplete="off"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="nome">NOME COMPLETO</label>     <!--campo de nome-->

        <div class="input-wrapper">
          <span class="input-icon">♙</span>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Informe seu nome completo"
            autocomplete="name"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="email">E-MAIL</label>

        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Informe seu e-mail"
            autocomplete="email"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="senha">CRIAR SENHA</label>

        <div class="input-wrapper">
          <span class="input-icon">♙</span>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Crie uma senha"
            autocomplete="new-password"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">CONFIRMAR SENHA</label>

        <div class="input-wrapper">
          <span class="input-icon">♙</span>
          <input
            type="password"
            id="confirmarSenha"
            name="confirmarSenha"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn-cadastrar">
        Cadastrar Usuário
      </button>

      <div id="mensagem" class="mensagem"></div>

    </form>

    <button
      type="button"
      class="btn-voltar"
      onclick="history.back()"
    >
      Voltar para o login
    </button>

  </main> <!-- tad fecha caixa de cadastro usuario-->

  <script src="js/cadastro.js"></script>
</body>
</html>
