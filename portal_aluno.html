<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdMusys — Portal do Aluno</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/portal_aluno.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <p>Portal do Aluno</p>
    </div>
    <div class="ifield">
      <label>Aluno</label>
      <div class="icontainer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
        <input type="text" id="usuario" placeholder="Digite seu usuario">
      </div>
    </div>
<div class="ifield">
  <label>senha</label>
  <div class="icontainer">
    <input type="password" id="senha" placeholder="Digite sua senha">
  </div>
</div>

    <div class="login-error" id="login-err">Selecione seu nome para entrar.</div>
    <button class="login-submit" onclick="doLogin()">Entrar no portal</button>
    <p class="login-hint">Acesso exclusivo para alunos matriculados</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="shell"></div>
</div>

<script src="js/portal_aluno.js"></script>
</body>
</html>
