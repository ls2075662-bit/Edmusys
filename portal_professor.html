<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdMusys — Portal do Professor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/portal_professor.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <!--add logo fonte-->
      <p>Portal do Professor</p>
    </div>
    <div class="ifield">
      <label>Professor</label>
      <div class="icontainer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <select id="sel-prof"><option value="">Selecione seu nome...</option></select>
      </div>
    </div>
    <div class="login-error" id="login-err">Selecione seu nome para entrar.</div>
    <button class="login-submit" onclick="doLogin()">Entrar no portal</button>
    <p class="login-hint">Acesso exclusivo para professores cadastrados</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="shell"></div>
</div>

<script src="js/portal_professor.js"></script>
</body>
</html>
